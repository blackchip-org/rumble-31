  <rect x="20" y="20" width="472" height="472" rx="72" fill="none" stroke="#d9a441" stroke-width="12"/>
  <text x="256" y="336" font-family="'New Rocker', serif" font-weight="400"
        font-size="220" fill="#ffffff" text-anchor="middle">31</text>
</svg>
