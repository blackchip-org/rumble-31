<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <filter id="felt" x="0%" y="0%" width="100%" height="100%" primitiveUnits="userSpaceOnUse">
    <feTurbulence type="fractalNoise" baseFrequency="0.02 0.026" numOctaves="2"
      seed="3" stitchTiles="stitch" result="macroNoise"/>
    <feColorMatrix in="macroNoise" type="matrix" result="macroGray"
      values="0.33 0.33 0.33 0 0
              0.33 0.33 0.33 0 0
              0.33 0.33 0.33 0 0
              0    0    0   0 1"/>
    <feComponentTransfer in="macroGray" result="macroSoft">
      <feFuncR type="linear" slope="0.4" intercept="0.72"/>
      <feFuncG type="linear" slope="0.4" intercept="0.72"/>
      <feFuncB type="linear" slope="0.4" intercept="0.72"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" in2="macroSoft" mode="multiply" result="mottled"/>

    <feTurbulence type="fractalNoise" baseFrequency="0.8 0.65" numOctaves="3"
      seed="7" stitchTiles="stitch" result="noiseA"/>
    <feColorMatrix in="noiseA" type="matrix" result="darkGrain"
      values="0 0 0 0 0.04
              0 0 0 0 0.20
              0 0 0 0 0.10
              0 0 0 0.42 0"/>

    <feTurbulence type="fractalNoise" baseFrequency="0.6 0.75" numOctaves="3"
      seed="23" stitchTiles="stitch" result="noiseB"/>
    <feColorMatrix in="noiseB" type="matrix" result="lightGrain"
      values="0 0 0 0 0.32
              0 0 0 0 0.60
              0 0 0 0 0.42
              0 0 0 0.28 0"/>

    <feMerge>
      <feMergeNode in="mottled"/>
      <feMergeNode in="darkGrain"/>
      <feMergeNode in="lightGrain"/>
    </feMerge>
  </filter>
  <rect width="300" height="300" fill="#1b5e3a" filter="url(#felt)"/>
</svg>
